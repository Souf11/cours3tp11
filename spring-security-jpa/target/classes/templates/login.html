<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - Application Sécurisée</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; margin-top: 100px; }
        .login-box {
            background: white; padding: 30px; border-radius: 8px;
            width: 340px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-bottom: 20px; }
        label { display: block; text-align: left; margin: 10px 0 5px; font-weight: bold; color: #555; }
        input { width: 92%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #2b5797; color: white; font-size: 16px; cursor: pointer; }
        button:hover { background: #1e3f6f; }
        p.error { color: #d9534f; background: #fdf7f7; padding: 8px; border-radius: 4px; border: 1px solid #d9534f; }
        p.logout { color: #5cb85c; background: #f7fdf7; padding: 8px; border-radius: 4px; border: 1px solid #5cb85c; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Authentification</h2>
    <form th:action="@{/login}" method="post">
        <label for="username">Nom d’utilisateur :</label>
        <input type="text" id="username" name="username" placeholder="Saisir le nom d’utilisateur" required>

        <label for="password">Mot de passe :</label>
        <input type="password" id="password" name="password" placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <p th:if="${param.error}" class="error">Identifiants incorrects, veuillez réessayer.</p>
    <p th:if="${param.logout}" class="logout">Vous êtes déconnecté avec succès.</p>
</div>
</body>
</html>
