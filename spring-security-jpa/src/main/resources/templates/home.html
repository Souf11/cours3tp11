<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Application Sécurisée</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 50px auto; max-width: 600px; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        ul { list-style: none; padding: 0; }
        li { margin: 12px 0; }
        a { text-decoration: none; color: #2b5797; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .btn-logout { background: #d9534f; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn-logout:hover { background: #c9302c; }
    </style>
</head>
<body>
<div class="card">
    <h2>Bienvenue dans l’application sécurisée</h2>
    <p>Connexion réussie ! Choisissez votre espace :</p>

    <ul>
        <li>👉 <a th:href="@{/user/dashboard}">Espace Utilisateur</a> (accessible à USER et ADMIN)</li>
        <li>👉 <a th:href="@{/admin/dashboard}">Espace Administrateur</a> (réservé à ADMIN)</li>
    </ul>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-logout">Se déconnecter</button>
    </form>
</div>
</body>
</html>
